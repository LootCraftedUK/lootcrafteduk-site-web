<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Removed</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;padding:32px;background:#0b0f14;color:#eef3f8}
main{max-width:560px;margin:40px auto}
h1{font-size:1.5rem;margin-bottom:8px}
p{color:#a9b4c2;line-height:1.5}
</style>
</head>
<body>
<main><h1>EAFC Trader removed</h1><p>This dashboard and its market data have been removed.</p></main>
<script>
(async()=>{
  try{
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
  }catch(e){}
})();
</script>
</body>
</html>
